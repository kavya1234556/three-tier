groups:
  - name: backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Backend is unreachable
          description: Prometheus has failed to scrape {{ $labels.instance }} for over 1 minute.

      - alert: MongoDBDisconnected
        expr: mongodb_connection_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Backend lost its MongoDB connection

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of requests are failing with 5xx

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: p95 request latency is above 1s

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="backend"} > 300 * 1024 * 1024
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Backend resident memory is above 300MB

      - alert: EventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="backend"} > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Node.js event loop p99 lag is above 500ms
