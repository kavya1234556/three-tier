services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
    networks: [app-net]

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER}/three-tier-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks: [app-net]

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER}/three-tier-frontend:${TAG:-latest}
    restart: unless-stopped
    networks: [app-net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [app-net]

volumes:
  mongo-data:

networks:
  app-net:
    name: app-net
